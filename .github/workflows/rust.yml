name: rust

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Хроника собственных ошибок CI (важнее результата) — все раунды падали на МОИХ
# ошибках автора пайплайна, а не на grammers:
#   раунд 1: `cargo … | tail` возвращает код хвоста ⇒ шаги показывали OK при
#            упавшей сборке. Лечится `set -o pipefail`.
#   раунд 2: `name: … (без стража: только печать)` — двоеточие в некавированном
#            скаляре ⇒ YAML не разбирается ⇒ run с 0 jobs за 3 с. Лечится кавычками.
#   раунд 3: Cargo.toml без заголовка [package] ⇒ cargo отвергает манифест, 0 jobs.
#   раунд 4: `cargo tree | head -20` + pipefail ⇒ exit 101: Rust игнорирует SIGPIPE,
#            cargo паникует на «failed printing to stdout: Broken pipe». Лечится
#            «пишем в файл, читаем файл».
#   раунд 4: `cargo test --release` несовместим с panic="abort" ⇒ тесты в dev-профиле.
#   раунд 4: android-actions/setup-android@v3 упал ⇒ NDK ставим напрямую.
#   раунд 5: host упал на сборке, android — на шаге NDK, но АННОТАЦИИ давали только
#            «Process completed with exit code 1»: логи job требуют scope actions:run,
#            которого у PAT нет (404 на /logs). Лечится тем, что лог выводится
#            РАБОЧИМ ПРОСТОМ через `::error::` workflow-команду (виден в аннотациях
#            и в HTML без авторизации).
#
# Поэтому: (1) валидация YAML/манифеста/исходников ДО пуша, (2) логи наружу,
# (3) никаких pipe-масок, (4) NDK без сторонних экшенов.

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # edition2024 в grammers-tl-types 0.12.0 ⇒ Cargo >= 1.85.
      # В песочнице rustc/cargo 1.83 (Alpine) — локальная сборка невозможна.
      - uses: dtolnay/rust-toolchain@stable

      - name: "версия тулчейна"
        run: |
          set -o pipefail
          rustc --version
          cargo --version
          cargo tree --depth 1 > tree.txt 2>&1 || true
          sed -n '1,25p' tree.txt

      - name: "сборка релиза (lib cdylib + bin)"
        id: build
        run: |
          set -o pipefail
          if cargo build --release > build.log 2>&1; then
            tail -25 build.log
            echo "предупреждений: $(grep -c '^warning' build.log || true)"
          else
            echo "::error::СБОРКА УПАЛА — полный лог ниже"
            sed -n '1,120p' build.log
            exit 1
          fi

      - name: "юнит-тесты (dev-профиль: release имеет panic=abort)"
        id: test
        run: |
          set -o pipefail
          if cargo test > test.log 2>&1; then
            tail -30 test.log
          else
            echo "::error::ТЕСТЫ УПАЛИ — лог ниже"
            sed -n '1,160p' test.log
            exit 1
          fi

      - name: "список возможностей, доказанных компилятором"
        run: |
          set -o pipefail
          ./target/release/purge --caps | tee caps.txt
          ./target/release/purge --session-format > session_format.txt
          cat session_format.txt

      - name: "размер артефактов"
        run: |
          set -o pipefail
          ls -la target/release/purge target/release/libpurge.so | tee sizes.txt
          du -sh target/release/libpurge.so

      # ★ Отчёт загружается ВСЕГДА, а не только на провал (раунд 13): гейт R1 стал
      #   зелёным, и таблица `--caps` — единственный результат раунда — осталась
      #   недоступной: логи job требуют scope actions:run, которого у PAT нет (404).
      #   Без неё я вижу «успех», но не вижу, ЧТО именно компилятор доказал.
      - name: "сохранить отчёт"
        uses: actions/upload-artifact@v4
        with:
          name: host-report
          path: |
            build.log
            test.log
            caps.txt
            session_format.txt
            sizes.txt
            tree.txt
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: "версия тулчейна"
        run: |
          set -o pipefail
          rustc --version
          cargo --version

      # ubuntu-latest НЕ гарантирует $ANDROID_HOME без экшена, а экшен в раунде 4 упал.
      # Ставим cmdline-tools сами: детерминированно и без чужих версий.
      - name: "Android cmdline-tools (без сторонних экшенов)"
        run: |
          set -o pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          if curl -sL --retry 3 --max-time 300 -o /tmp/clt.zip "$URL"; then
            echo "cmdline-tools скачан: $(stat -c%s /tmp/clt.zip) байт"
          else
            echo "::error::не скачал cmdline-tools (сеть runner'а)"
            exit 1
          fi
          unzip -q -o /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv -f "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      # Раунд 6: путь к NDK был ЗАХАРдкожен (ndk/27.0.12077973), а sdkmanager
      # кладёт пакет по своему имени — проверка `test -d` упала и шаг умер
      # ДО загрузки бинарей. Теперь каталог ищется по факту установки.
      - name: "NDK r27"
        run: |
          set -o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > lic.log 2>&1 || true
          if "$SDKM" --install "ndk;27.0.12077973" > ndk.log 2>&1; then
            tail -4 ndk.log
          else
            echo "::error::sdkmanager не поставил NDK — лог ниже"
            sed -n '1,80p' ndk.log
            exit 1
          fi
          echo "=== что реально установлено в \$ANDROID_HOME/ndk ==="
          ls -1 "$ANDROID_HOME/ndk" > ndkdirs.txt 2>&1 || true
          cat ndkdirs.txt
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -1)"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "::error::каталог NDK не найден после установки"
            sed -n '1,40p' ndk.log 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls -1 "$BIN" > bins.txt 2>&1 || true
          echo "=== бинарей в NDK: $(wc -l < bins.txt) ==="
          if ! grep -q "aarch64-linux-android24-clang" bins.txt; then
            echo "::error::в NDK нет aarch64-linux-android24-clang"
            head -40 bins.txt
            exit 1
          fi
          grep "aarch64-linux-android" bins.txt | sed -n '1,6p'

      - name: "cargo-ndk"
        run: |
          set -o pipefail
          # Раунд 7: `--version 3.0.6` → «could not find cargo-ndk in registry with
          # version =3.0.6». Версию НЕ пиннуем: берём последнюю, а записанную
          # версию логируем, чтобы прогон был воспроизводим по факту.
          if cargo install cargo-ndk --locked > ndkinst.log 2>&1; then
            tail -4 ndkinst.log
            # вывод в файл, не в head: pipefail + SIGPIPE = паника cargo (раунд 4)
            cargo ndk --version > ndkver.txt 2>&1 || true
            sed -n '1,3p' ndkver.txt
          else
            echo "::error::cargo-ndk не установился"
            sed -n '1,80p' ndkinst.log
            exit 1
          fi

      - name: "сборка под Android arm64-v8a"
        run: |
          set -o pipefail
          if cargo ndk -t arm64-v8a --platform 24 build --release > android.log 2>&1; then
            tail -30 android.log
            echo "ошибок: $(grep -c '^error' android.log || true)"
          else
            echo "::error::ANDROID-СБОРКА УПАЛА — лог ниже"
            sed -n '1,160p' android.log
            exit 1
          fi

      - name: "проверить артефакты"
        run: |
          set -o pipefail
          ls -la target/aarch64-linux-android/release/libpurge.so target/aarch64-linux-android/release/purge
          file target/aarch64-linux-android/release/libpurge.so | tee android_file.txt
          nm -D --defined-only target/aarch64-linux-android/release/libpurge.so > symbols.txt 2>&1 || true
          echo "символов T: $(grep -c ' T ' symbols.txt || true)" | tee -a android_file.txt
          sed -n '1,12p' symbols.txt

      - uses: actions/upload-artifact@v4
        with:
          name: purge-android-arm64
          path: |
            target/aarch64-linux-android/release/libpurge.so
            target/aarch64-linux-android/release/purge
          if-no-files-found: error

      - name: "сохранить отчёт android"
        uses: actions/upload-artifact@v4
        with:
          name: android-report
          path: |
            android.log
            android_file.txt
            symbols.txt
            ndk.log
            bins.txt
            ndkinst.log
            ndkver.txt
          if-no-files-found: ignore
