name: rust

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Почему pipefail в каждой секции: в раунде 1 шаги «юнит-тесты» и «список
# возможностей» показали OK, хотя сборка падала — конвейер `cargo ... | tail`
# возвращает код хвоста, а не cargo.
#
# Почему все name в кавычках: раунд 2 упал с 0 jobs за 3 с, потому что
# `name: версия тулчейна (без стража: только печать)` — двоеточие внутри
# некавированного скаляра ломает разбор всего файла (проверено yaml.safe_load
# локально: "mapping values are not allowed here", line 22). YAML теперь
# валидируется ДО пуша, а не после падения CI.

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # edition2024 в grammers-tl-types 0.12.0 требует Cargo >= 1.85.
      # В песочнице rustc/cargo 1.83 (Alpine) => локальная сборка невозможна.
      - uses: dtolnay/rust-toolchain@stable

      - name: "версия тулчейна"
        run: |
          set -o pipefail
          rustc --version
          cargo --version
          cargo tree --depth 1 2>&1 | head -20

      - name: "сборка и юнит-тесты (без сети)"
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log | tail -30
          echo "ошибок: $(grep -c '^error' build.log || true)"
          cargo test --release 2>&1 | tail -30

      - name: "список возможностей, доказанных компилятором"
        run: |
          set -o pipefail
          ./target/release/purge --caps

      - name: "размер артефактов"
        run: |
          set -o pipefail
          ls -la target/release/purge target/release/libpurge.so
          du -sh target/release/libpurge.so

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: "версия тулчейна"
        run: |
          set -o pipefail
          rustc --version
          cargo --version

      - name: "установить SDK/NDK"
        uses: android-actions/setup-android@v3

      - name: "NDK r27"
        run: |
          set -o pipefail
          yes | sdkmanager --install "ndk;27.0.12077973" >/dev/null 2>&1 || sdkmanager --install "ndk;27.0.12077973"
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          ls "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep -E "aarch64-linux-android(21|24)?clang(\.py)?$" | head -4

      - name: "cargo-ndk"
        run: |
          set -o pipefail
          cargo install cargo-ndk --locked --version 3.0.6

      - name: "сборка под Android arm64-v8a"
        run: |
          set -o pipefail
          cargo ndk -t arm64-v8a --platform 24 build --release 2>&1 | tee android.log | tail -40
          echo "ошибок: $(grep -c '^error' android.log || true)"

      - name: "проверить артефакты"
        run: |
          set -o pipefail
          ls -la target/aarch64-linux-android/release/libpurge.so target/aarch64-linux-android/release/purge
          file target/aarch64-linux-android/release/libpurge.so
          echo "=== экспортируемые символы ==="
          nm -D --defined-only target/aarch64-linux-android/release/libpurge.so | grep -c " T " || echo "nm не дал ничего"
          nm -D --defined-only target/aarch64-linux-android/release/libpurge.so | head -12 || true

      - uses: actions/upload-artifact@v4
        with:
          name: purge-android-arm64
          path: |
            target/aarch64-linux-android/release/libpurge.so
            target/aarch64-linux-android/release/purge
          if-no-files-found: error
