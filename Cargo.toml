[package]
name = "purge"
version = "0.1.0"
edition = "2021"

# ГЕЙТ R1 (PLAN_RUST §3, §10): ПРОЙДЕН в раундах 13–20 — host + android зелёные,
# 0 warning / 0 error, 69 юнит-тестов, бинарь `purge` = ELF aarch64 «for Android 24».
#
# ★ 26.11: crate-type больше НЕ содержит cdylib. Причина — замер раунда 18:
#   `nm -D --defined-only libpurge.so` → 0 символов T (strip=true и ни одного
#   `#[no_mangle] extern "C"`), значит Kotlin звать .so нечем, а починка требует
#   либо unsafe-моста (ломает `#![deny(unsafe_code)]`), либо JNA.
#   Путь «APK поднимает бинарь `purge serve` как дочерний процесс» обходит это
#   целиком: тот же loopback HTTP, ноль FFI, и проверяемо в CI без устройства
#   (readelf: NEEDED только bionic). См. PLAN_RUST §11.
#
# ★ panic = "abort" убран. Две причины, обе измерены:
#   1) `cargo test --release` с ним несовместим (раунд 4: тесты приходилось гонять
#      в dev-профиле);
#   2) в дочернем процессе APK паника = abort всего процесса, то есть один баг
#      убивал бы весь движок вместо одной задачи. Unwind позволяет вернуть ошибку
#      через границу HTTP и остаться живым.
[lib]
name = "purge"
crate-type = ["rlib"]

[[bin]]
name = "purge"
path = "src/main.rs"

[dependencies]
# default-features = false убирает sqlite-storage ⇒ libsql (C-зависимость) не попадает
# в граф, и Android собирается без C-компилятора.
grammers-client = { version = "0.12.0", default-features = false, features = ["fs"] }
grammers-session = { version = "0.12.0", default-features = false, features = ["serde"] }
grammers-mtsender = { version = "0.12.0", default-features = false }
grammers-tl-types = { version = "0.12.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP-слой (src/api.rs) — только std + serde_json + tiny_http, без grammers,
# поэтому тестируется ЛОКАЛЬНО (tools/localtest), а не шестью минутами CI.
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
